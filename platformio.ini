[env:attiny85]
platform                  = atmelavr
board                     = attiny85
framework                 =

; --- Upload via Arduino Uno running ArduinoISP sketch ---
upload_protocol           = stk500v1
upload_port               = COM5        ; change to your Uno's port
upload_speed              = 19200

; --- Clock ---
board_build.f_cpu         = 8000000L   ; 8 MHz internal oscillator

; --- Fuses ---
; lfuse 0xE2 = 8 MHz internal osc, CKDIV8 unprogrammed (full speed)
; hfuse 0xDF = bootloader disabled, SPIEN enabled, all else default
; efuse 0xFF = no BOD (brownout detect off)
board_fuses.lfuse         = 0xE2
board_fuses.hfuse         = 0xDF
board_fuses.efuse         = 0xFF

; --- Build flags ---
build_flags               =
    -mmcu=attiny85
    -DF_CPU=8000000L
    -Os                   ; optimize for size – important on 8KB flash
    -std=gnu++11

; --- Compiler/linker ---
build_unflags             = -std=gnu++14   ; atmelavr platform default, override it
debug_tool = simavr
