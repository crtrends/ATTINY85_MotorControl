[env:attiny85]
platform                  = atmelavr
board                     = attiny85
framework                 =
upload_protocol           = stk500v1
upload_port               = COM4
upload_speed              = 19200
board_build.f_cpu         = 8000000L
board_fuses.lfuse         = 0xE2
board_fuses.hfuse         = 0xDF
board_fuses.efuse         = 0xFF
build_flags               =
    -mmcu=attiny85
    -DF_CPU=8000000L
    -Os
    -std=gnu++11
build_unflags             = -std=gnu++14

[env:attiny85_debug]
extends                   = env:attiny85
build_type                = debug
debug_tool                = simavr
build_flags               =
    -mmcu=attiny85
    -DF_CPU=8000000L
    -Og
    -g3
    -std=gnu++11